<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EUPLUS · Marka Logo Arşivi</title>
<style>
:root{--bg:#fbfaf8;--fg:#1a1a18;--mut:#6b6b66;--card:#fff;--bd:#e7e4de;--stage:#fff}
[data-t="dark"]{--bg:#141413;--fg:#f2f0ec;--mut:#9d9a94;--card:#1e1e1c;--bd:#33322e;--stage:#f7f6f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1100px;margin:0 auto;padding:48px 24px 8px;display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--mut);margin:0;max-width:52ch;font-size:15px}
button{margin-left:auto;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:24px 24px 64px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.stage{background:var(--stage);aspect-ratio:4/3;display:grid;place-items:center;padding:28px;
background-image:linear-gradient(45deg,#0000000a 25%,#0000 25%,#0000 75%,#0000000a 75%),linear-gradient(45deg,#0000000a 25%,#0000 25%,#0000 75%,#0000000a 75%);
background-size:18px 18px;background-position:0 0,9px 9px}
.stage img{width:100%;height:100%;object-fit:contain}
figcaption{padding:14px 16px 16px;border-top:1px solid var(--bd)}
h3{margin:0 0 8px;font-size:15px;font-weight:600}
.pal{display:flex;gap:6px;margin-bottom:10px}
.sw{width:18px;height:18px;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px #00000018}
.dl{display:flex;gap:6px;flex-wrap:wrap}
.dl a{font-size:12px;text-decoration:none;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:3px 9px}
.dl a:hover{color:var(--fg);border-color:var(--mut)}
footer{max-width:1100px;margin:0 auto;padding:0 24px 64px;color:var(--mut);font-size:13px;border-top:1px solid var(--bd);padding-top:24px}
</style></head>
<body>
<header>
 <div><h1>EUPLUS · Marka Logo Arşivi</h1>
 <p class="lead">Orijinal vektörel kaynaklardan tek tek ayrıştırılmış logolar. SVG'ler sonsuz ölçeklenebilir, PNG'lerin arka planı şeffaftır.</p></div>
 <button onclick="var d=document.documentElement;d.dataset.t=d.dataset.t==='dark'?'light':'dark'">Açık / Koyu</button>
</header>
